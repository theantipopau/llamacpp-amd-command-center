[package]
name = "llamacpp-command-center-desktop"
version = "0.2.0"
description = "Desktop vertical slice for the llama.cpp Command Center (ADR-006)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
